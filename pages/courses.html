<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ODGC Handicap — Courses</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%2384e1bc' /%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23000' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0:#07080d; --bg-1:#0c0f17; --bg-2:#11151f;
      --surface:rgba(255,255,255,0.04); --surface-2:rgba(255,255,255,0.06);
      --border:rgba(255,255,255,0.07); --border-2:rgba(255,255,255,0.12);
      --ink:#e5ecf6; --ink-dim:#9aa5b6; --ink-faint:#6b7689;
      --accent:#84e1bc; --accent-2:#5ec6a0; --accent-ink:#07120c;
      --warn:#f5b454; --err:#f87171; --ok:#6ee7b7; --code-bg:#050609;
      --shadow-card: 0 1px 0 rgba(255,255,255,0.05) inset,
                     0 20px 40px -16px rgba(0,0,0,0.55),
                     0 2px 6px rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background:
        radial-gradient(1200px 600px at 100% -10%, rgba(132,225,188,0.10), transparent 60%),
        radial-gradient(900px 500px at -10% 0%, rgba(110,170,255,0.06), transparent 55%),
        linear-gradient(180deg, var(--bg-0), var(--bg-1) 30%, var(--bg-1));
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-feature-settings: "cv02","cv03","cv04","cv11";
      letter-spacing: -0.005em;
      min-height: 100vh;
      padding: 48px 20px 96px;
    }
    .grain {
      position: fixed; inset: 0; pointer-events: none; opacity: 0.4; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' seed='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
      background-size: 180px 180px; z-index: 0;
    }
    .glow {
      position: fixed; pointer-events: none; z-index: 0;
      width: 600px; height: 600px; border-radius: 50%;
      top: -180px; right: -160px;
      background: radial-gradient(closest-side, rgba(132,225,188,0.18), transparent 70%);
      filter: blur(20px);
    }
    .wrap { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; }

    header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .logo {
      width: 36px; height: 36px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 0 1px rgba(0,0,0,0.4) inset, 0 8px 24px -10px rgba(132,225,188,0.6);
      color: var(--accent-ink); font-weight: 800;
    }
    .brand { display: flex; flex-direction: column; line-height: 1; }
    .brand .name { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    .brand .sub  { font-size: 12px; color: var(--ink-dim); margin-top: 4px; }

    nav.tabs {
      display: flex; gap: 6px; margin-bottom: 28px;
      padding: 4px; background: rgba(255,255,255,0.03);
      border: 1px solid var(--border); border-radius: 12px; width: fit-content;
    }
    nav.tabs a {
      padding: 8px 16px; border-radius: 8px;
      font-size: 13px; font-weight: 600; color: var(--ink-dim);
      text-decoration: none; letter-spacing: -0.005em;
      transition: color .12s ease, background .12s ease;
    }
    nav.tabs a:hover { color: var(--ink); }
    nav.tabs a.active {
      background: linear-gradient(180deg, rgba(132,225,188,0.15), rgba(132,225,188,0.08));
      color: var(--accent);
      box-shadow: 0 0 0 1px rgba(132,225,188,0.22), 0 4px 14px -6px rgba(132,225,188,0.35);
    }

    .hero h1 {
      font-size: 36px; line-height: 1.1; font-weight: 800;
      letter-spacing: -0.025em; margin: 8px 0 12px;
    }
    .hero h1 .grad {
      background: linear-gradient(120deg, var(--accent), #cbe9d4 60%, #ffffff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero .tag { color: var(--ink-dim); font-size: 15px; line-height: 1.55; margin: 0; max-width: 580px; }

    .card {
      background: linear-gradient(180deg, var(--surface), var(--surface-2));
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: 16px;
      padding: 22px; box-shadow: var(--shadow-card); margin-top: 24px;
    }
    .card-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 16px;
    }
    .card-head h2 {
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
      font-weight: 700; color: var(--ink-faint); margin: 0;
    }
    .card-head .right { font-size: 12px; color: var(--ink-faint); }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-wrap input {
      flex: 1; font: inherit; font-size: 15px; color: var(--ink);
      padding: 11px 14px; background: var(--bg-2);
      border: 1px solid var(--border-2); border-radius: 10px;
      transition: border-color .12s ease, box-shadow .12s ease, background .12s ease;
    }
    .input-wrap input::placeholder { color: var(--ink-faint); }
    .input-wrap input:hover { border-color: rgba(255,255,255,0.18); }
    .input-wrap input:focus {
      outline: 0; border-color: rgba(132,225,188,0.55);
      box-shadow: 0 0 0 4px rgba(132,225,188,0.10); background: var(--bg-1);
    }

    /* ---------- course cards ---------- */
    .course-card[hidden] { display: none !important; }

    .course-head {
      display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px;
      padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    .course-title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); }
    .course-code-badge {
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
      padding: 2px 7px; border-radius: 6px;
      background: rgba(132,225,188,0.10); color: var(--accent);
      border: 1px solid rgba(132,225,188,0.25);
      font-family: 'JetBrains Mono', monospace;
    }
    .course-count { font-size: 12px; color: var(--ink-faint); margin-left: auto; }

    .records-table {
      width: 100%; border-collapse: collapse;
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
    }
    .records-table th, .records-table td {
      padding: 7px 10px; text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .records-table th {
      color: var(--ink-faint); font-weight: 600; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .records-table td.num, .records-table th.num { text-align: right; }
    .records-table tr:last-child td { border-bottom: 0; }
    .records-table tr.winner td { background: rgba(132,225,188,0.06); }
    .records-table tr.winner td.score-val { color: var(--accent); font-weight: 700; }

    .no-results {
      color: var(--ink-faint); font-style: italic; text-align: center; padding: 20px 0;
    }
    .loading-msg {
      color: var(--ink-dim); font-style: italic; text-align: center;
      padding: 16px 0; font-size: 14px;
    }
    .err-msg {
      color: var(--err); background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.25);
      padding: 12px 14px; border-radius: 10px; font-size: 13px;
    }

    footer { margin-top: 36px; text-align: center; color: var(--ink-faint); font-size: 12px; }
    footer a { color: var(--ink-dim); text-decoration: none; }
    footer a:hover { color: var(--ink); }

    .reveal { animation: reveal 0.4s ease-out both; }
    .reveal.delay-1 { animation-delay: 0.05s; }
    .reveal.delay-2 { animation-delay: 0.10s; }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
<div class="grain" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>

<div class="wrap">

  <header class="reveal">
    <div class="logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
        <circle cx="12" cy="12" r="3" fill="currentColor"/>
      </svg>
    </div>
    <div class="brand">
      <span class="name">ODGC</span>
      <span class="sub">Ottawa Disc Golf Club — handicap updater</span>
    </div>
  </header>

  <nav class="tabs reveal">
    <a href="/">Ingest</a>
    <a href="/players">Players</a>
    <a href="/courses" class="active">Courses</a>
    <a href="/admin">Admin</a>
  </nav>

  <div class="hero reveal delay-1">
    <h1>Course <span class="grad">leaderboards</span>.</h1>
    <p class="tag">All-time top gross scores by course — excluding one-off and excluded layouts.</p>
  </div>

  <div class="card reveal delay-1">
    <div class="card-head"><h2>Filter</h2><span class="right" id="course-count"></span></div>
    <div class="field">
      <div class="input-wrap">
        <input id="filter-input" type="text" placeholder="type to filter courses (e.g. larrimac, ferguson)">
      </div>
    </div>
  </div>

  <div id="courses-wrap">
    <div class="card reveal delay-2"><div class="loading-msg">Loading course records…</div></div>
  </div>

  <footer>
    <span>worker · <a href="https://odgc-hc.chris-lay9.workers.dev" target="_blank" rel="noopener">odgc-hc.chris-lay9.workers.dev</a></span>
  </footer>

</div>

<script>
const CONFIG = { workerUrl: "https://odgc-hc.chris-lay9.workers.dev" };
const $ = (id) => document.getElementById(id);
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

async function loadCourses() {
  try {
    const resp = await fetch(CONFIG.workerUrl, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({action: "course_records"}),
    });
    const data = await resp.json();
    if (!data.ok) {
      $("courses-wrap").innerHTML =
        `<div class="card"><div class="err-msg">Error: ${escapeHtml(data.error || "unknown error")}</div></div>`;
      return;
    }
    renderCourses(data.records);
  } catch (e) {
    $("courses-wrap").innerHTML =
      `<div class="card"><div class="err-msg">Network error: ${escapeHtml(String(e))}</div></div>`;
  }
}

function computeRanks(players) {
  let rank = 1;
  for (let i = 0; i < players.length; i++) {
    if (i > 0 && players[i].gross > players[i - 1].gross) rank = i + 1;
    players[i].rank = rank;
  }
  return players;
}

function renderCourses(records) {
  const codes = Object.keys(records);
  if (codes.length === 0) {
    $("courses-wrap").innerHTML = `<div class="card"><div class="no-results">No course data found.</div></div>`;
    return;
  }

  $("course-count").textContent = `${codes.length} courses`;

  const cards = codes.map(code => {
    const rec = records[code];
    const players = computeRanks(rec.top);
    const rows = players.map(p => {
      const isWinner = p.rank === 1;
      return `<tr class="${isWinner ? "winner" : ""}">
        <td class="num">${p.rank}</td>
        <td>${escapeHtml(p.player)}</td>
        <td class="num score-val">${p.gross}</td>
        <td>${escapeHtml(p.event)}</td>
        <td class="num">${String(p.year).slice(-2)}</td>
      </tr>`;
    }).join("");

    return `<div class="card course-card" data-name="${escapeHtml(rec.name.toLowerCase())}" data-code="${escapeHtml(code)}">
      <div class="course-head">
        <span class="course-title">${escapeHtml(rec.name)}</span>
        <span class="course-code-badge">${escapeHtml(code)}</span>
        <span class="course-count">${players.length} record${players.length !== 1 ? "s" : ""}</span>
      </div>
      <div style="overflow-x:auto">
        <table class="records-table">
          <thead><tr>
            <th class="num">#</th><th>Player</th>
            <th class="num">Score</th><th>Event</th><th class="num">Yr</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }).join("");

  $("courses-wrap").innerHTML = cards;
  wireFilter();
}

function wireFilter() {
  $("filter-input").addEventListener("input", () => {
    const q = $("filter-input").value.trim().toLowerCase();
    let visible = 0;
    document.querySelectorAll(".course-card").forEach(card => {
      const match = !q || card.dataset.name.includes(q) || card.dataset.code.includes(q);
      card.hidden = !match;
      if (match) visible++;
    });
    $("course-count").textContent = q
      ? `${visible} of ${document.querySelectorAll(".course-card").length} courses`
      : `${document.querySelectorAll(".course-card").length} courses`;
  });
}

loadCourses();
</script>

</body>
</html>
